<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <title>Fifteen</title>
  <link rel="stylesheet" href="web.css?layout=sidebar">
  <script src="web.js?layout=sidebar" defer></script>
</head>
<body>
  <main>
    <aside class="sidebar" aria-label="Game controls">
      <header><a class="brand" href="./">fifteen</a><span id="version">Development preview</span></header>
      <fieldset id="modes" disabled aria-label="Players">
        <div class="player" id="player-x"><span class="player-symbol">X</span><div class="player-options" role="group" aria-label="X player"><button type="button" data-controller="human" aria-pressed="true">Human</button><button type="button" data-controller="computer" aria-pressed="false">Computer</button><button type="button" data-controller="experimental" aria-pressed="false">Experimental</button></div></div>
        <div class="player" id="player-o"><span class="player-symbol">O</span><div class="player-options" role="group" aria-label="O player"><button type="button" data-controller="human" aria-pressed="false">Human</button><button type="button" data-controller="computer" aria-pressed="true">Computer</button><button type="button" data-controller="experimental" aria-pressed="false">Experimental</button></div></div>
      </fieldset>
      <fieldset id="levels" disabled aria-describedby="levels-note"><legend>Levels</legend><div class="level-options"></div></fieldset>
      <button id="new-game" class="new-game" disabled>New game</button>
      <div class="status-wrap"><h2 id="status" role="status" aria-live="polite">Loading…</h2><p id="substatus">Downloading the Python runtime.</p></div>
      <div class="game-top"><span id="board-title">Board</span><span id="move-count">MOVE 00 / 09</span></div>
      <div class="moves"><span>Moves</span><p id="history">No moves yet.</p></div>
      <button id="retry" hidden>Retry loading</button>
      <p id="levels-note" class="mode-note">Changing players or levels starts a new game.</p>
    </aside>
    <section class="play-area" aria-label="Game board">
      <div class="board-viewport"><div id="board" class="board" role="group" aria-label="Tic-tac-toe board"></div></div>
    </section>
  </main>
  <noscript>This game needs JavaScript enabled to run Python in your browser.</noscript>
</body>
</html>
