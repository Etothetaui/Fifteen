<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10171d">
  <title>Fifteen · Games</title>
  <link rel="stylesheet" href="collection.css?ui=collection">
</head>
<body>
  <main>
    <header><a class="brand" href="./">Fifteen</a><span>v0.4.0-dev</span></header>
    <h1>Choose a game</h1>
    <div class="games">
      <a class="game" href="tic-tac-toe/">
        <div class="board" aria-hidden="true"><i>×</i><i></i><i>○</i><i></i><i>×</i><i></i><i>○</i><i></i><i>×</i></div>
        <h2>Tic-tac-toe</h2>
        <p>Play recursive boards across one to six levels.</p>
        <span class="open">Play tic-tac-toe <b aria-hidden="true">→</b></span>
      </a>
      <a class="game relay" href="relay/">
        <div class="emblems" aria-hidden="true"><i>☼</i><span>—</span><i>☼</i><span>—</span><i>☼</i></div>
        <h2>Relay</h2>
        <p>Claim relays, complete emblem groups, and route your opponent through ten levels.</p>
        <span class="open">Play Relay <b aria-hidden="true">→</b></span>
      </a>
    </div>
  </main>
</body>
</html>
